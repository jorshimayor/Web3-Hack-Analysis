name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  evm-check:
    name: EVM case checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt for Belong
        run: |
          cd chains/evm/belong
          forge fmt --check
        id: fmt-belong

      - name: Run Forge fmt for UPS
        run: |
          cd chains/evm/ups
          forge fmt --check
        id: fmt-ups

      - name: Run Forge build for Belong
        run: |
          cd chains/evm/belong
          forge build --sizes
        id: build-belong

      - name: Run Forge build for UPS
        run: |
          cd chains/evm/ups
          forge build --sizes
        id: build-ups

      - name: Run Forge tests for Belong
        run: |
          cd chains/evm/belong
          forge test -vvv
        id: test-belong

      - name: Run Forge tests for UPS
        run: |
          cd chains/evm/ups
          forge test -vvv
        id: test-ups
