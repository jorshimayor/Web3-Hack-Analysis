<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 332" width="720" height="332" role="img" aria-labelledby="t">
<title id="t">Naive ERC-4626 vault: a 9,000 token deposit after a 10,000 donation mints 0 shares and the attacker's 1 share redeems 19,000</title>
<rect width="720" height="332" rx="12" fill="#fcfcfb"/>
<text x="24" y="34" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b" xml:space="preserve">Naive vault: the attack works</text>
<text x="24" y="66" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="normal" fill="#0b0b0b" xml:space="preserve">Vault state after the 1 wei deposit and the 10,000 donation</text>
<rect x="24" y="80" width="141" height="34" rx="6" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="94.45" y="102" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">totalSupply = 1</text>
<rect x="171" y="80" width="181" height="34" rx="6" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="261.5" y="102" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">totalAssets = 10,000</text>
<text x="24" y="146" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="normal" fill="#0b0b0b" xml:space="preserve">Victim deposits</text>
<text x="24" y="176" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#0b0b0b" xml:space="preserve">9,000 × 1 / 10,000 = 0.8999</text>
<text x="24" y="198" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#eb6834" xml:space="preserve">→ 0 shares. Victim owns nothing.</text>
<text x="24" y="236" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="normal" fill="#0b0b0b" xml:space="preserve">Attacker redeems</text>
<text x="24" y="260" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#0b0b0b" xml:space="preserve">1 share × 19,000 / 1 = 19,000 tokens</text>
<text x="24" y="290" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52514e" xml:space="preserve">The attacker's single share now claims 19,000 tokens. Profit 9,000.</text>
<text x="24" y="308" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#8a8984" xml:space="preserve">Foundry 1.5.1, OpenZeppelin Contracts 5.4.0, from the erc4626-inflation-lab test suite.</text>
</svg>