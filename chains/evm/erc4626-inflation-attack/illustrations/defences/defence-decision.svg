<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" role="img" aria-labelledby="t">
<title id="t">Decision flow for choosing an ERC-4626 inflation attack defence by library, deployment control, and sensitivity to donations</title>
<rect width="720" height="390" rx="12" fill="#fcfcfb"/>
<text x="24" y="34" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b" xml:space="preserve">Which defence fits your vault?</text>
<rect x="24" y="66" width="300" height="40" rx="6" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="36" y="91" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0b0b0b" xml:space="preserve">Does totalAssets() read a live token balance?</text>
<line x1="324" y1="86" x2="360" y2="86" stroke="#8a8984" stroke-width="1.5"/>
<polygon points="360,86 353,89 353,83" fill="#8a8984"/>
<rect x="364" y="69" width="44" height="34" rx="6" fill="#eef3fb" fill-opacity="1" stroke="#2a78d6" stroke-width="1.5"/>
<text x="386.0" y="91" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#0b0b0b" xml:space="preserve">No</text>
<text x="418" y="91" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" xml:space="preserve">Internal accounting already. Add a seed or offset.</text>
<line x1="64" y1="106" x2="64" y2="128" stroke="#8a8984" stroke-width="1.5"/>
<polygon points="64,128 61,121 67,121" fill="#8a8984"/>
<rect x="24" y="136" width="300" height="40" rx="6" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="36" y="161" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0b0b0b" xml:space="preserve">Are you on OpenZeppelin's ERC4626?</text>
<line x1="324" y1="156" x2="360" y2="156" stroke="#8a8984" stroke-width="1.5"/>
<polygon points="360,156 353,159 353,153" fill="#8a8984"/>
<rect x="364" y="139" width="44" height="34" rx="6" fill="#eef3fb" fill-opacity="1" stroke="#2a78d6" stroke-width="1.5"/>
<text x="386.0" y="161" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#0b0b0b" xml:space="preserve">Yes</text>
<text x="418" y="161" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" xml:space="preserve">Override _decimalsOffset() to 6 or more.</text>
<line x1="64" y1="176" x2="64" y2="198" stroke="#8a8984" stroke-width="1.5"/>
<polygon points="64,198 61,191 67,191" fill="#8a8984"/>
<rect x="24" y="206" width="300" height="40" rx="6" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="36" y="231" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0b0b0b" xml:space="preserve">Do you control deployment?</text>
<line x1="324" y1="226" x2="360" y2="226" stroke="#8a8984" stroke-width="1.5"/>
<polygon points="360,226 353,229 353,223" fill="#8a8984"/>
<rect x="364" y="209" width="44" height="34" rx="6" fill="#eef3fb" fill-opacity="1" stroke="#2a78d6" stroke-width="1.5"/>
<text x="386.0" y="231" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#0b0b0b" xml:space="preserve">Yes</text>
<text x="418" y="231" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" xml:space="preserve">Seed deposit, shares burned to 0xdead.</text>
<line x1="64" y1="246" x2="64" y2="268" stroke="#8a8984" stroke-width="1.5"/>
<polygon points="64,268 61,261 67,261" fill="#8a8984"/>
<rect x="24" y="276" width="300" height="40" rx="6" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="36" y="301" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0b0b0b" xml:space="preserve">Does an oracle read your share price?</text>
<line x1="324" y1="296" x2="360" y2="296" stroke="#8a8984" stroke-width="1.5"/>
<polygon points="360,296 353,299 353,293" fill="#8a8984"/>
<rect x="364" y="279" width="44" height="34" rx="6" fill="#eef3fb" fill-opacity="1" stroke="#2a78d6" stroke-width="1.5"/>
<text x="386.0" y="301" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#0b0b0b" xml:space="preserve">Yes</text>
<text x="418" y="301" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52514e" xml:space="preserve">Internal accounting, plus a seed or offset.</text>
<text x="24" y="348" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52514e" xml:space="preserve">Pick one as the defence and keep a minimum-shares-out check in the front end as the user's second layer.</text>
<text x="24" y="366" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#8a8984" xml:space="preserve">Combinations are cheap: an offset plus a seed deposit covers rounding and donations together.</text>
</svg>