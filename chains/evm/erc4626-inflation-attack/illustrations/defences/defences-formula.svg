<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 324" width="720" height="324" role="img" aria-labelledby="t">
<title id="t">Three ERC-4626 inflation attack defences compared on the share formula: dead shares raise total supply, virtual shares add an offset, internal accounting replaces total assets</title>
<rect width="720" height="324" rx="12" fill="#fcfcfb"/>
<text x="24" y="34" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b" xml:space="preserve">Three defences, one formula</text>
<text x="24" y="66" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="normal" fill="#0b0b0b" xml:space="preserve">shares = assets × totalSupply / totalAssets</text>
<text x="24" y="86" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52514e" xml:space="preserve">Each defence changes one term. Orange marks the change.</text>
<rect x="24" y="104" width="212" height="150" rx="8" fill="#f1f1ee" fill-opacity="1"/>
<text x="38" y="128" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" xml:space="preserve">1. Dead shares</text>
<text x="38" y="156" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#0b0b0b" xml:space="preserve">assets × (supply</text>
<text x="38" y="178" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#eb6834" xml:space="preserve">+ 1,000 burned)</text>
<text x="38" y="200" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#0b0b0b" xml:space="preserve">/ totalAssets</text>
<text x="38" y="238" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52514e" xml:space="preserve">Supply never reaches 1.</text>
<rect x="254" y="104" width="212" height="150" rx="8" fill="#f1f1ee" fill-opacity="1"/>
<text x="268" y="128" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" xml:space="preserve">2. Virtual shares</text>
<text x="268" y="156" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#0b0b0b" xml:space="preserve">assets × (supply</text>
<text x="268" y="178" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#eb6834" xml:space="preserve">+ 10^offset)</text>
<text x="268" y="200" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#0b0b0b" xml:space="preserve">/ (assets + 1)</text>
<text x="268" y="238" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52514e" xml:space="preserve">Vault acts as if pre-funded.</text>
<rect x="484" y="104" width="212" height="150" rx="8" fill="#f1f1ee" fill-opacity="1"/>
<text x="498" y="128" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" xml:space="preserve">3. Internal accounting</text>
<text x="498" y="156" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#0b0b0b" xml:space="preserve">assets × supply</text>
<text x="498" y="178" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#eb6834" xml:space="preserve">/ accountedAssets</text>
<text x="498" y="238" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52514e" xml:space="preserve">Donations don't count.</text>
<text x="24" y="282" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52514e" xml:space="preserve">Dead shares and virtual shares make inflating the ratio expensive. Internal accounting ignores the donation.</text>
<text x="24" y="300" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#8a8984" xml:space="preserve">Virtual shares as in OpenZeppelin Contracts 5.x _convertToShares. Dead shares as in Uniswap V2 MINIMUM_LIQUIDITY.</text>
</svg>