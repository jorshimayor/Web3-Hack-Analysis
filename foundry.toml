[profile.default]
src = "chains/evm/template/src"
test = "chains/evm/template/test"
out = "out"
libs = ["lib"]
solc = "0.8.25"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./chains" }]

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
mainnet = "${ETH_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
